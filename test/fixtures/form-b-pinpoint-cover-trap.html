<!DOCTYPE html><html lang="en"><body><form class="external-form" id="application-form">
  <label data-field="full_name">Full name<input name="full_name" autocomplete="name"></label>
  <label data-field="email">Email<input name="email" type="email" autocomplete="email"></label>
  <label data-field="phone">Phone<input name="phone" type="tel" autocomplete="tel"></label>
  <label data-field="cover_letter">Cover letter / CV upload<input type="file" name="cover" data-testid="pinpoint-cover-letter" aria-label="CV" accept="application/pdf"></label>
  <label data-field="resume">Résumé PDF<input type="file" name="application_form[application][cv]" data-testid="pinpoint-resume" accept="application/pdf"></label>
</form></body></html>
