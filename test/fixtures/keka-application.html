<!doctype html><html><body><form>
  <label for="mobilePhone.number">Mobile Phone</label>
  <select class="select2-hidden-accessible" aria-hidden="true" name="mobilePhone.countryCode" id="mobilePhone.countryCode"><option>+91</option></select>
  <span class="select2"><span role="combobox" aria-labelledby="select2-mobilePhonecountryCode-container"></span></span>
  <input id="mobilePhone.number" name="mobilePhone.number" required>
  <label for="workExperience">Experience</label>
  <input id="workExperience" name="workExperience.years">
  <input value="Years" readonly>
  <select name="workExperience.months"><option value="0">0</option></select>
  <input value="Months" readonly>
  <label for="currentSalary">Current Salary *</label>
  <select class="select2-hidden-accessible" aria-hidden="true" name="currentSalary.currency"><option>INR</option></select>
  <input id="currentSalary" name="currentSalary.amount" required>
  <input name="currentSalary.salaryPeriod" value="Annual" readonly>
  <button type="submit">Apply</button>
</form></body></html>
