<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Form B · Phenom cover trap</title></head>
<body><main><form class="rjsf">
  <label>Legal Given Name(s)<input id="cntryFields.firstName" autocomplete="given-name"></label>
  <label>Legal Family Name<input id="cntryFields.lastName" autocomplete="family-name"></label>
  <label>Email Address<input id="email" autocomplete="email"></label>
  <label>Phone Number<input id="phoneWidget.phoneNumber" autocomplete="tel-national"></label>
  <label>Cover letter / CV upload<input type="file" data-testid="phenom-cover-letter" aria-label="CV" accept="application/pdf"></label>
  <label>Resume PDF<input type="file" data-testid="phenom-resume" accept="application/pdf"></label>
  <label><input type="checkbox" id="emailOptIn"> I consent to receive recruiting emails</label>
  <button type="submit">Submit application</button>
</form></main></body></html>
