<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form B · SmartRecruiters cover trap</title></head>
<body><main><h1>Application</h1><form id="application">
  <label>Full name<input name="full_name" autocomplete="name"></label>
  <label>Email<input name="email" type="email" autocomplete="email"></label>
  <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
  <label>Cover letter / CV upload<input type="file" data-testid="smartrecruiters-cover-letter" aria-label="CV" accept="application/pdf"></label>
  <label>Resume PDF<input type="file" data-testid="smartrecruiters-resume" accept="application/pdf"></label>
  <label><input type="checkbox" name="privacy_consent"> I accept the privacy notice</label>
  <button type="submit">Submit application</button>
</form></main></body></html>
