<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live miss · LinkedIn Easy Apply</title>
</head>
<body>
  <div class="jobs-easy-apply-modal" data-test-modal-id="easy-apply">
    <h2>Easy Apply</h2>
    <fieldset>
      <legend>Have you completed the following level of education: Bachelor's Degree?</legend>
      <label><input type="radio" name="edu" value="Yes" /> Yes</label>
      <label><input type="radio" name="edu" value="No" /> No</label>
    </fieldset>
    <label>How many years of work experience do you have with JavaScript?
      <input type="text" name="js_years" />
    </label>
    <label>Are you legally authorized to work in the country of this job?
      <input type="text" name="work_auth" />
    </label>
    <button type="button">Next</button>
  </div>
</body>
</html>
