<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Live miss · Greenhouse iframe inner form</title>
</head>
<body>
  <div id="grnhse_app">
    <form id="application">
      <label>First name
        <input type="text" name="first_name" autocomplete="given-name" />
      </label>
      <label>Last name
        <input type="text" name="last_name" autocomplete="family-name" />
      </label>
      <label>Email
        <input type="email" name="email" autocomplete="email" />
      </label>
      <label>Resume
        <input type="file" name="resume" data-testid="resume" accept="application/pdf" />
      </label>
      <label>Cover letter
        <input type="file" name="cover_letter" data-testid="cover_letter" accept="application/pdf" />
      </label>
    </form>
  </div>
</body>
</html>
