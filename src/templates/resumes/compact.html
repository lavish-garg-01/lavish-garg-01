<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{FULL_NAME}}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #1e293b;
    }
    a { color: inherit; text-decoration: none; }
    .resume-header {
      border-left: 3px solid #163b66;
      padding-left: 0.7em;
    }
    h1 {
      margin: 0;
      color: #0f2744;
      font-size: 1.75em;
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .headline {
      margin: 0.08em 0;
      color: #334155;
      font-size: 1em;
      font-weight: 600;
    }
    .contact {
      color: #475569;
      font-size: 1em;
      line-height: 1.22;
      overflow-wrap: anywhere;
    }
    h2 {
      margin: 0 0 0.25em;
      padding-bottom: 0.1em;
      border-bottom: 1.5px solid #163b66;
      color: #0f2744;
      font-size: 1em;
      line-height: 1.1;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    p { margin: 0; }
    .skill-line { margin: 0 0 var(--resume-bullet-gap, 0px); }
    .role { margin: 0 0 var(--resume-item-gap, 4px); }
    .role:last-child { margin-bottom: 0; }
    .role-head,
    .edu-line {
      display: flex;
      justify-content: space-between;
      gap: 1em;
      align-items: baseline;
    }
    .role-head strong { color: #0f2744; }
    .role-head strong,
    .edu-line span:first-child { min-width: 0; }
    .role-head span,
    .edu-line span:last-child {
      flex: 0 0 auto;
      font-size: 1em;
      white-space: nowrap;
    }
    .company { margin: 0.03em 0 0.1em; color: #334155; font-weight: 600; }
    ul { margin: 0; padding-left: 1.2em; }
    li { margin: 0 0 var(--resume-bullet-gap, 0px); padding-left: 0.05em; }
    li:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="resume-page" aria-label="Resume">
    <div class="resume-content">
      <header class="resume-section resume-header">
        <h1>{{FULL_NAME}}</h1>
        <div class="headline">{{HEADLINE}}</div>
        <div class="contact">{{CONTACT_HTML}}</div>
      </header>

      <section class="resume-section">
        <h2>Professional Summary</h2>
        <p>{{SUMMARY}}</p>
      </section>

      <section class="resume-section">
        <h2>Skills</h2>
        {{SKILL_GROUPS}}
      </section>

      <section class="resume-section">
        <h2>Professional Experience</h2>
        {{EXPERIENCE_ATS}}
      </section>

      {{PROJECTS}}

      <section class="resume-section">
        <h2>Education</h2>
        {{EDUCATION_CLASSIC}}
      </section>
    </div>
  </main>
</body>
</html>
