<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{FULL_NAME}}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
    }
    a { color: inherit; text-decoration: none; }
    .resume-header {
      text-align: center;
      border-bottom: 1.5px solid #1f3a5f;
      padding-bottom: 0.45em;
    }
    h1 {
      margin: 0 0 0.1em;
      color: #102a43;
      font-size: 2em;
      line-height: 1.05;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .contact {
      color: #334e68;
      font-size: 1em;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    h2 {
      margin: 0 0 0.28em;
      padding-bottom: 0.12em;
      border-bottom: 1px solid #829ab1;
      color: #102a43;
      font-size: 1.02em;
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    p { margin: 0; }
    .skill-line { margin: 0 0 var(--resume-bullet-gap, 0px); }
    .role { margin: 0 0 var(--resume-item-gap, 4px); }
    .role:last-child { margin-bottom: 0; }
    .role-head,
    .edu-line {
      display: flex;
      justify-content: space-between;
      gap: 1em;
      align-items: baseline;
      margin-bottom: 0.1em;
      font-weight: 700;
    }
    .role-head span:first-child,
    .edu-line span:first-child { min-width: 0; }
    .role-head span:last-child,
    .edu-line span:last-child {
      flex: 0 0 auto;
      font-size: 1em;
      white-space: nowrap;
    }
    ul { margin: 0; padding-left: 1.25em; }
    li { margin: 0 0 var(--resume-bullet-gap, 0px); padding-left: 0.08em; }
    li:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="resume-page" aria-label="Resume">
    <div class="resume-content">
      <header class="resume-section resume-header">
        <h1>{{FULL_NAME}}</h1>
        <div class="contact">{{CONTACT_HTML}}</div>
      </header>

      <section class="resume-section">
        <h2>Professional Summary</h2>
        <p>{{SUMMARY}}</p>
      </section>

      <section class="resume-section">
        <h2>Skills</h2>
        {{SKILL_GROUPS}}
      </section>

      <section class="resume-section">
        <h2>Professional Experience</h2>
        {{EXPERIENCE_CLASSIC}}
      </section>

      {{PROJECTS}}

      <section class="resume-section">
        <h2>Education</h2>
        {{EDUCATION_CLASSIC}}
      </section>
    </div>
  </main>
</body>
</html>
