<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{FULL_NAME}}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
    }
    a { color: inherit; text-decoration: none; }
    .resume-header {
      padding-bottom: 0.35em;
      border-bottom: 2px solid #245c8a;
    }
    h1 {
      margin: 0;
      color: #102a43;
      font-size: 1.9em;
      line-height: 1.05;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }
    .headline {
      margin: 0.08em 0 0.18em;
      color: #245c8a;
      font-size: 1.05em;
      font-weight: 700;
    }
    .contact {
      color: #486581;
      font-size: 1em;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    h2 {
      margin: 0 0 0.18em;
      color: #102a43;
      font-size: 1.02em;
      line-height: 1.1;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    h2::after {
      content: "";
      display: block;
      width: 2.8em;
      margin-top: 0.1em;
      border-bottom: 2px solid #245c8a;
    }
    p { margin: 0; }
    .skill-line { margin: 0 0 var(--resume-bullet-gap, 0px); }
    .role {
      margin: 0 0 var(--resume-item-gap, 4px);
      padding-left: 0.65em;
      border-left: 2px solid #bcccdc;
    }
    .role:last-child { margin-bottom: 0; }
    .role-head,
    .edu-line {
      display: flex;
      justify-content: space-between;
      gap: 1em;
      align-items: baseline;
    }
    .role-head strong,
    .edu-line span:first-child { min-width: 0; }
    .role-head span,
    .edu-line span:last-child {
      flex: 0 0 auto;
      color: #486581;
      font-size: 1em;
      white-space: nowrap;
    }
    .role-company {
      margin: 0.02em 0 0.12em;
      color: #245c8a;
      font-weight: 700;
    }
    ul { margin: 0; padding-left: 1.18em; }
    li { margin: 0 0 var(--resume-bullet-gap, 0px); padding-left: 0.05em; }
    li:last-child { margin-bottom: 0; }
  </style>
</head>
<body>
  <main class="resume-page" aria-label="Resume">
    <div class="resume-content">
      <header class="resume-section resume-header">
        <h1>{{FULL_NAME}}</h1>
        <div class="headline">{{HEADLINE}}</div>
        <div class="contact">{{CONTACT_HTML}}</div>
      </header>

      <section class="resume-section">
        <h2>Professional Summary</h2>
        <p>{{SUMMARY}}</p>
      </section>

      <section class="resume-section">
        <h2>Skills</h2>
        {{SKILL_GROUPS}}
      </section>

      <section class="resume-section">
        <h2>Professional Experience</h2>
        {{EXPERIENCE_SPLIT}}
      </section>

      {{PROJECTS}}

      <section class="resume-section">
        <h2>Education</h2>
        {{EDUCATION_CLASSIC}}
      </section>
    </div>
  </main>
</body>
</html>
