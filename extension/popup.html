<!doctype html>
<html><head><meta charset="utf-8"><style>
body{width:320px;margin:0;padding:16px;background:#f8fafc;color:#102a43;font:14px system-ui,sans-serif}.head{display:flex;gap:12px;align-items:center}.pet{width:64px;height:64px;object-fit:contain;filter:drop-shadow(0 7px 8px #1e3a8a33);animation:float 2.8s ease-in-out infinite}h1{font-size:17px;margin:0}p{color:#64748b;margin:2px 0 12px;font-size:12px}button,a.action{box-sizing:border-box;border:1px solid #cbd5e1;background:#fff;color:#102a43;border-radius:9px;padding:9px;font-weight:700;cursor:pointer;text-align:center;text-decoration:none}.status{margin:12px 0;line-height:1.4;padding:10px;background:#fff;border-radius:10px}.error{color:#b91c1c}.success{color:#047857}.session-actions{display:flex;gap:8px;margin:10px 0}.btn-primary{background:#315ee7;color:#fff;border-color:#315ee7;flex:1}.btn-danger{background:#fff;color:#b91c1c;border-color:#fca5a5}details{margin-top:10px;border-top:1px solid #e2e8f0;padding-top:9px}input{box-sizing:border-box;width:100%;margin:7px 0;padding:8px;border:1px solid #cbd5e1;border-radius:7px}.advanced{display:grid;gap:7px;margin-top:8px}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}</style></head>
<body><div class="head"><img class="pet" src="assets/pet-robot-v2.png" alt="Application agent robot"><div><h1>Application agent</h1><p>Runs automatically · Teach Mode on</p></div></div><div id="status" class="status">Observing the current page…</div><button id="open-sidecar" class="btn-primary" style="width:100%">Open application sidecar</button><div id="actions" class="session-actions" style="display:none"><button id="pause-btn" class="btn-primary">⏸️ Pause</button><button id="unlink-btn" class="btn-danger">✕ Unlink job</button></div><button id="process" class="btn-primary" style="width:100%;display:none">Process this form now</button><details><summary>Advanced fallback</summary><div class="advanced"><button id="replay">Test learned autofill (never submits)</button><button id="dashboard">Open dashboard</button><button id="filled">Mark as filled manually</button><button id="confirm-submitted" style="display:none">Verify submitted application</button><label>Local connection<input id="api" value="http://127.0.0.1:3001"></label><button id="save">Save connection</button></div></details><script src="popup.js"></script></body></html>
